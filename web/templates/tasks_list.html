<!DOCTYPE html>
<html>
    <head>
        <title>Tasks List</title>
    </head>
    <body>

    <ul>
        {{range .tasks_list}}
            <li>ID: {{.ID}}, Name: {{.Name}}, TeamID: {{.TeamID}}, Team: {{.Team.Name}}, Deadline: {{.Deadline}}</li>
        {{end}}
    </ul>

    <br>
    {{if .message}}
        <p>{{.message}}</p>
    {{end}}
    </br>
    </body>
</html>
